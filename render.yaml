# Render 블루프린트 — 웹 화면과 서버를 서비스 1개로 배포(같은 출처) + 무료 PostgreSQL.
# 무료 플랜 주의:
#  - 웹 서비스: 15분 무요청 시 잠들고, 깨어나는 데 최대 약 1분 → 스테이징 전용
#  - DB(free): 생성 후 30일 기한 → 기한 전에 Neon 무료 DB 로 옮기거나 유료 전환 필요(docs/12-deploy-recovery.md)
services:
  - type: web
    name: quickplay-staging
    runtime: node
    plan: free
    region: singapore
    buildCommand: npx --yes pnpm@10.0.0 install --frozen-lockfile --prod=false && npx --yes pnpm@10.0.0 --filter @qp/web build
    startCommand: cd apps/server && ./node_modules/.bin/tsx src/index.ts
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true # Render 가 무작위 값 생성(사람이 입력하지 않음)
      - key: WEB_DIST
        value: /opt/render/project/src/apps/web/dist
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CORS_ORIGINS
        value: https://quickplay-staging.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: quickplay-db
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        # 구글 OAuth 클라이언트 ID — 공개값(비밀 아님). Google Cloud 프로젝트 quickplay-515800 > 클라이언트 "QuickPlay Web"
        value: 833779122071-irnrsbf4ve50i8u334lqdorfgvg27k6t.apps.googleusercontent.com

databases:
  - name: quickplay-db
    plan: free
    region: singapore
    databaseName: quickplay
    user: quickplay
