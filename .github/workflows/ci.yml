name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 타입·린트·규칙/서버 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qp
          POSTGRES_PASSWORD: qp
          POSTGRES_DB: quickplay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qp" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: 단위·통합 테스트 (메모리 저장소)
        run: pnpm test
      - name: 통합 테스트 (PostgreSQL 저장소)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://qp:qp@127.0.0.1:5432/quickplay_test
      - run: pnpm --filter @qp/web build

  e2e:
    name: 브라우저 E2E (2인 대전·모바일 에뮬레이션)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
